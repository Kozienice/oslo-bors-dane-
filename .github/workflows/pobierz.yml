name: pobierz-dane-oslo

# Godziny w UTC (GitHub nie zna stref czasowych).
# 04:45 UTC = 06:45 Oslo latem (CEST) / 05:45 zima (CET)  -> przed zadaniem PORTFEL (pon 07:30)
# 14:40 UTC = 16:40 Oslo latem (po zamknieciu sesji 16:20) / 15:40 zima (przed zamknieciem)
# 15:40 UTC = 17:40 Oslo latem / 16:40 zima (po zamknieciu sesji)
# 06:20 UTC = 08:20 Oslo latem / 07:20 zima; 07:20 UTC = 09:20 Oslo latem / 08:20 zima
#   -> dwa poranne przebiegi przez caly rok: zawsze jeden ok. 08:20 Oslo, po komunikatach 07:00-08:00 (np. ruch NAS 08:01),
#      przed zadaniem PORTFEL (pon 08:45 Oslo); zmiana 06.10.2026 (PB-106)
# GitHub moze opozniac zaplanowane uruchomienia o kilka-kilkadziesiat minut.
# 05.10.2026: harmonogram nie uruchomil sie ani razu (0 przebiegow 'schedule' od 02.10) -> ponowne zapisanie pliku rejestruje cron w GitHub.
# 05.10.2026: pierwsze przebiegi 'schedule' z duzym opoznieniem (04:45 -> 11:51, 14:40 -> 21:37, 15:40 -> 22:09 UTC).
on:
  workflow_dispatch:
  schedule:
    - cron: "45 4 * * 1-5"
    - cron: "20 6 * * 1-5"
    - cron: "20 7 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "40 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: pobierz-dane-oslo
  cancel-in-progress: false

jobs:
  pobierz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r wymagania.txt
      - name: oslo
        run: python oslo.py
        continue-on-error: true
      - name: zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "brak zmian w danych"
          else
            git commit -m "dane: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
