name: zalaczniki-na-zadanie
# uruchamia sie po zmianie listy messageId (push) albo recznie; pobiera tresci i zalaczniki PDF z api3 newsweb
on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/zalaczniki_lista.txt"
permissions:
  contents: write
concurrency:
  group: pobierz-dane-oslo
  cancel-in-progress: false
jobs:
  zalaczniki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r wymagania.txt
      - run: python narzedzia/zalaczniki.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "zalaczniki na zadanie: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase && git push
