name: sonda-portali
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sonda-portali
  cancel-in-progress: false
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: timeout 540 python narzedzia/sonda.py || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonda
          git commit -m "sonda portali $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git pull --rebase && git push
